<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fill=(s,v)=>(s||"").replace(/\{(\w+)\}/g,(m,k)=>v[k]??"");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
const NATIVE=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem&&Capacitor.Plugins.Share);
async function nativeSave(name,blob){const X=Capacitor.Plugins,b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(blob)});
  const w=await X.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});await X.Share.share({title:name,url:w.uri})}
function saveFile(name,blob){if(NATIVE()){nativeSave(name,blob).catch(e=>{if(!(e&&/cancel|dismiss/i.test(e.message||"")))toast("Couldn't share the file")});return}if(DL){DL.save({filename:name,data:blob}).catch(e=>{if(e&&e.code!=="declined")toast("Download isn't available here")});return}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function blocks(p){const L=p.split("\n");let h="",list=null,m,i=0;const close=()=>{if(list){h+="</"+list+">";list=null}};

async function ask(messages,system,onText,signal,max,prov){

function fieldHtml(f,st){
  const v=st.vals[f.k];
  const inp=f.t==="area"?`<textarea data-k="${f.k}" rows="5" placeholder="${esc(f.p||"")}">${esc(v)}</textarea>`
   :f.t==="sel"?`<select data-k="${f.k}">${f.o.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>`
   :`<input data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.p||"")}">`;
  return `<label class="fld"><span>${esc(f.l)}</span>${inp}</label>`}
const FILEACC=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.sql,.sh,.java,.c,.cpp,.go,.rs,.rb,.php,text/*";
function chipsHtml(st){return st.pend.txt.map((f,i)=>`<span class="chip">📎 ${esc(f.name)}<button type="button" data-rm="t${i}" aria-label="Remove">✕</button></span>`).join("")+st.pend.img.map((u,i)=>`<span class="chip"><img src="${u}" alt="">image<button type="button" data-rm="i${i}" aria-label="Remove">✕</button></span>`).join("")}

function viewTool(tool){
  viewing=tool.id;const st=S(tool),chat=tool.k==="chat",pinned=P.pins.includes(tool.id),R=readyList();
  const head=`<div class="thead" data-c="${tool.c}"><div class="big">${tool.i}</div><div style="min-width:0"><h1>${esc(tool.n)}</h1><p>${esc(tool.d)}</p></div><span class="sp"></span>
  ${R.length>1?`<select class="btn" id="tprov" title="Which AI answers here" aria-label="AI for this tool"><option value="">Default AI</option>${R.map(x=>`<option value="${esc(x.id)}"${x.id===st.prov?" selected":""}>${esc(x.n.replace(/ \(.*\)/,""))}</option>`).join("")}</select>`:""}
  ${tool.mine?`<a class="btn" href="#/edit/${esc(tool.id)}">Edit</a>`:""}
  ${chat?`<button class="btn" id="exp" type="button">Export</button><button class="btn" id="newchat" type="button">New chat</button>`:""}
  <button class="btn" id="pin" type="button" aria-pressed="${pinned}">${pinned?"★ Pinned":"☆ Pin"}</button></div>
  <details class="adv"><summary>Instructions for this tool</summary><textarea id="sysov" rows="5" placeholder="${esc(fill(tool.sys,st.vals))}">${esc(st.sys)}</textarea><p class="hint">This is what the AI is told before your message. Edit it to change how this tool behaves, or leave it blank for the default.</p></details>`;
  const hasArea=tool.f.some(f=>f.t==="area");
  if(chat){
    $("#view").innerHTML=head+(tool.f.length?`<div class="setup">${tool.f.map(f=>fieldHtml(f,st)).join("")}</div>`:"")+`<div class="thread" id="outbody"></div>
    <div class="chips" id="chips"></div>
    <form class="compose" id="compose"><button class="ib" type="button" id="att" title="Attach a file or image" aria-label="Attach">📎</button><input type="file" id="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,${FILEACC}"><textarea id="msg" rows="1" placeholder="Message…" aria-label="Message"></textarea><button class="ib" type="button" id="mic" title="Dictate" aria-label="Dictate" ${SR?"":"hidden"}>🎤</button><button class="run" id="run">Send</button></form>`;
    const msg=$("#msg"),form=$("#compose");
    form.onsubmit=e=>{e.preventDefault();if(st.busy){st.ctl&&st.ctl.abort();return}
      const v=msg.value.trim();if(!v&&!st.pend.img.length&&!st.pend.txt.length)return;
      if(!st.msgs.length)st.sid=Date.now();
      const att=st.pend.txt.map(f=>"[Attached file: "+f.name+"]\n```\n"+f.text+"\n```").join("\n\n");
      st.msgs.push({role:"user",content:(att?att+"\n\n":"")+v,img:st.pend.img.slice()});st.pend={txt:[],img:[]};
      msg.value="";msg.style.height="auto";$("#chips").innerHTML="";run(tool)};
    msg.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}};
    msg.oninput=()=>{msg.style.height="auto";msg.style.height=Math.min(140,msg.scrollHeight)+"px"};
    $("#att").onclick=()=>$("#file").click();
    $("#file").onchange=async e=>{await takeFiles([...e.target.files],st);e.target.value="";$("#chips").innerHTML=chipsHtml(st)};
    $("#chips").innerHTML=chipsHtml(st);
    $("#chips").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;const k=b.dataset.rm,i=+k.slice(1);(k[0]==="t"?st.pend.txt:st.pend.img).splice(i,1);$("#chips").innerHTML=chipsHtml(st)};
    $("#mic").onclick=e=>dictate(e.currentTarget,t=>{msg.value=(msg.value+" "+t).trim();msg.oninput()});
    $("#newchat").onclick=()=>{if(st.ctl)st.ctl.abort();st.msgs=[];st.text="";st.err="";st.sid=0;persist(tool);paint(tool)};
    $("#exp").onclick=()=>exportChat(tool);
  }else{
    $("#view").innerHTML=head+`<div class="work" data-c="${tool.c}"><form class="form" id="form">${tool.f.map(f=>fieldHtml(f,st)).join("")}
    ${hasArea?`<div class="aux"><button type="button" class="btn" id="fatt">📎 Load a file</button><button type="button" class="btn" id="fmic" ${SR?"":"hidden"}>🎤 Dictate</button></div>`:""}
    <div class="aux"><button class="run" id="run">Run</button>${tool.f.some(f=>f.t!=="sel"&&f.p)?`<button type="button" class="btn" id="ex">Try an example</button>`:""}</div>
    <input type="file" id="file" hidden accept="${FILEACC}"></form>
    <section class="out"><div id="outbody"></div><div id="outbar"></div></section></div>`;
    const firstArea=tool.f.find(f=>f.t==="area"),setVal=(k,v)=>{st.vals[k]=v;const el=$(`[data-k=${k}]`);if(el)el.value=v};
    $("#form").onsubmit=e=>{e.preventDefault();start(tool)};
    $("#form").onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();start(tool)}};
    if(hasArea){
      $("#fatt").onclick=()=>$("#file").click();
      $("#file").onchange=async e=>{const t0=[];for(const f of e.target.files){if(f.size>3e6){toast(f.name+" is too large (3 MB max)");continue}try{t0.push(await readText(f))}catch(er){toast("Couldn't read "+f.name)}}
        e.target.value="";if(t0.length){const cur=st.vals[firstArea.k]||"";setVal(firstArea.k,(cur?cur+"\n\n":"")+t0.join("\n\n").slice(0,150000));toast("File loaded")}};
      $("#fmic").onclick=e=>dictate(e.currentTarget,t=>setVal(firstArea.k,((st.vals[firstArea.k]||"")+" "+t).trim()))}
    const ex=$("#ex");if(ex)ex.onclick=()=>{tool.f.forEach(f=>{if(f.t!=="sel"&&f.p&&!(st.vals[f.k]||"").trim())setVal(f.k,f.p)})};
    $("#outbar").onclick=e=>{const b=e.target.closest("[data-a]");if(b)action(tool,b.dataset.a)};
    $("#outbar").onsubmit=e=>{e.preventDefault();const i=$("#rf"),v=i&&i.value.trim();if(!v||st.busy)return;st.msgs.push({role:"user",content:v});run(tool)};
  }
  $("#view").oninput=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)st.vals[k]=e.target.value;if(e.target.id==="sysov"){st.sys=e.target.value;persist(tool)}};
  $("#view").onchange=e=>{if(e.target.id==="tprov")st.prov=e.target.value};
  $("#outbody").onclick=e=>{
    const tb=e.target.closest("[data-tab]");if(tb){st.tab=tb.dataset.tab;paint(tool);return}
    const fc=e.target.closest(".fc");if(fc){fc.classList.toggle("flip");return}
    const cp=e.target.closest(".cp");if(cp){const code=cp.parentElement.querySelector("code");navigator.clipboard.writeText(code.textContent).then(()=>{cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy",1200)},()=>toast("Copy isn't available here"));return}
    const ba=e.target.closest("[data-ba]");if(ba){const m=st.msgs[+ba.dataset.i];
      if(ba.dataset.ba==="copy"&&m)navigator.clipboard.writeText(m.content).then(()=>toast("Copied"),()=>toast("Copy isn't available here"));
      else if(ba.dataset.ba==="say"&&m)say(m.content);
      else if(ba.dataset.ba==="redo"&&!st.busy&&st.msgs.length&&st.msgs[st.msgs.length-1].role==="assistant"){st.msgs.pop();run(tool)}}};
  $("#pin").onclick=()=>{P.pins=pinned?P.pins.filter(x=>x!==tool.id):[...P.pins,tool.id];saveP();viewTool(tool)};
  paint(tool)}

function userBubble(m){const c=(m.content||"").replace(/\[Attached file: ([^\]\n]+)\]\n```[\s\S]*?\n```/g,"📎 $1"),im=(m.img||[]).map(u=>`<img class="th2" src="${u}" alt="attachment">`).join("");return `<div class="b u">${im}${esc(c)}</div>`}
function bubbles(tool,st){
  let h=`<div class="b a"><div class="prose"><p>${esc(tool.hello||"")}</p></div></div>`;
  st.msgs.forEach((m,i)=>{h+=m.role==="user"?userBubble(m):`<div class="b a"><div class="prose">${md(m.content)}</div><div class="ba"><button type="button" data-ba="copy" data-i="${i}">Copy</button><button type="button" data-ba="say" data-i="${i}">🔊 Read</button>${i===st.msgs.length-1&&!st.busy?'<button type="button" data-ba="redo">↻ Retry</button>':""}</div></div>`});
  if(st.busy)h+=`<div class="b a"><div class="prose">${st.text?md(st.text):'<span class="dots"><i></i><i></i><i></i></span>'}</div></div>`;
  return h+(st.err?`<div class="err">${esc(st.err)}</div>`:"")}

function bodyHtml(tool,st){
  const err=st.err?`<div class="err">${esc(st.err)}</div>`:"";
  if(!st.text&&!st.busy)return err+`<div class="empty">Fill in the form and press Run. Your result appears here.</div>`;
  if(st.busy&&!st.text)return `<div class="empty"><span class="dots"><i></i><i></i><i></i></span></div>`;
  const tx=st.text;
  if(tool.k==="svg"){const sv=getSvg(tx);if(sv){st.svg=sv;return err+`<img class="pic" alt="Generated image" src="${svgUrl(sv)}">`}
    return err+(st.busy?`<div class="empty">Painting…</div>`:`<div class="prose">${md(tx)}</div>`)}
  if(tool.k==="html"){
    if(st.busy)return `<div class="empty">Building…</div><div class="stream">${esc(tx.slice(-900))}</div>`;
    const code=getHtml(tx);if(!code)return err+`<div class="prose">${md(tx)}</div>`;st.html=code;
    return err+`<div class="tabs"><button class="btn${st.tab==="preview"?" on":""}" data-tab="preview">Preview</button><button class="btn${st.tab==="code"?" on":""}" data-tab="code">Code</button></div>`+
      (st.tab==="code"?`<div class="prose"><pre><button class="cp" type="button">Copy</button><code>${esc(code)}</code></pre></div>`:`<iframe class="frame" sandbox="allow-scripts allow-forms allow-modals" title="Preview" srcdoc="${esc(code)}"></iframe>`)}
  if(tool.k==="cards"){
    if(st.busy)return `<div class="empty">Making cards…</div>`;
    const c=getCards(tx);st.cards=c;
    return err+(c&&c.length?`<p style="margin-top:0;color:var(--mute)">Tap a card to flip it.</p><div class="cards">${c.map(x=>`<button class="fc" type="button"><span class="q">${esc(x.q)}</span><span class="a">${esc(x.a)}</span></button>`).join("")}</div>`:`<div class="prose">${md(tx)}</div>`)}
  return err+`<div class="prose">${md(tx)}</div>`}

function paint(tool){
  if(viewing!==tool.id)return;const st=S(tool),body=$("#outbody");if(!body)return;
  const near=innerHeight+scrollY>=document.body.scrollHeight-180,chat=tool.k==="chat";
  body.innerHTML=chat?bubbles(tool,st):bodyHtml(tool,st);
  if(st.via&&(st.text||st.msgs.length)){const lt=lastA(st.msgs);body.insertAdjacentHTML("beforeend",`<p class="via">via ${esc(st.via)}${!st.busy&&st.ms&&lt?` · ${(st.ms/1000).toFixed(1)}s · ${words(lt)} words`:""}</p>`)}
  const run=$("#run");if(run){run.textContent=st.busy?"Stop":chat?"Send":"Run";run.classList.toggle("stop",st.busy)}
  if(chat){if(near&&st.busy)scrollTo(0,document.body.scrollHeight);return}
  const bar=$("#outbar");
  if(st.text&&!st.busy){
    const dl=tool.k==="svg"&&st.svg?`<button class="btn" data-a="svg" type="button">Download SVG</button><button class="btn" data-a="png" type="button">Download PNG</button>`:tool.k==="html"&&st.html?`<button class="btn" data-a="html" type="button">Download HTML</button>`:`<button class="btn" data-a="md" type="button">Download .md</button>`;
    bar.innerHTML=`<div class="bar"><button class="btn" data-a="copy" type="button">Copy</button><button class="btn" data-a="say" type="button">🔊 Read</button>${dl}<button class="btn" data-a="again" type="button">Run again</button><button class="btn" data-a="clear" type="button">Clear</button></div>
      <form class="refine"><input id="rf" placeholder="Ask for a change… e.g. shorter, add more color" aria-label="Ask for a change"><button class="btn pri">Apply</button></form>`
  }else bar.innerHTML=""}

function action(tool,a){
  const st=S(tool);
  if(a==="copy"){const v=tool.k==="svg"?st.svg:tool.k==="html"?st.html:tool.k==="cards"&&st.cards?st.cards.map(c=>c.q+"\n"+c.a).join("\n\n"):st.text;navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>toast("Copy isn't available here"))}
  else if(a==="say")say(st.text);
  else if(a==="again")start(tool);
  else if(a==="clear"){st.msgs=[];st.text="";st.err="";persist(tool);paint(tool)}
  else if(a==="svg")saveFile(tool.id+".svg",new Blob([st.svg],{type:"image/svg+xml"}));
  else if(a==="html")saveFile(tool.id+".html",new Blob([st.html],{type:"text/html"}));
  else if(a==="md")saveFile(tool.id+".md",new Blob([st.text],{type:"text/markdown"}));
  else if(a==="png"){const im=new Image();im.onload=()=>{const vb=st.svg.match(/viewBox="[\d.\s-]*?([\d.]+)\s+([\d.]+)"/);const w=vb?+vb[1]:512,h=vb?+vb[2]:512,c=document.createElement("canvas");c.width=w*2;c.height=h*2;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?saveFile(tool.id+".png",b):toast("Couldn't make PNG"))};im.onerror=()=>toast("Couldn't make PNG");im.src=svgUrl(st.svg)}}

const H={q:""};
function histList(){const q=H.q.toLowerCase().trim(),L=D.hist.filter(h=>{if(!q)return true;const tl=findTool(h.tool);return (h.title+" "+(tl?tl.n:h.tool)+" "+h.msgs.map(m=>m.content).join(" ")).toLowerCase().includes(q)});
  $("#hl").innerHTML=L.length?L.map(h=>{const tl=findTool(h.tool);return `<div class="hi"><button class="hopen" data-key="${esc(h.key)}" type="button"><span class="e">${tl?tl.i:"•"}</span><span class="ht"><b>${esc(h.title)}</b><small>${esc(tl?tl.n:h.tool)} · ${new Date(h.ts).toLocaleString()} · ${h.msgs.length} messages</small></span></button><button class="btn" data-del="${esc(h.key)}" type="button" aria-label="Delete">✕</button></div>`}).join(""):`<div class="empty">${D.hist.length?"Nothing matches your search.":"Nothing saved yet. Use any tool and it shows up here."}</div>`}
function viewHistory(){
  viewing="history";
  $("#view").innerHTML=`<div class="thead" data-c="learn"><div class="big">🕘</div><div><h1>History</h1><p>Chats and results saved in this browser.</p></div><span class="sp"></span><button class="btn" id="hx" type="button">Export all</button><button class="btn" id="hc" type="button">Clear</button></div>
  <input id="hq" class="hs" type="search" placeholder="Search your history…" value="${esc(H.q)}" aria-label="Search history"><div id="hl"></div>`;
  histList();
  $("#hq").oninput=e=>{H.q=e.target.value;histList()};
  $("#hl").onclick=e=>{const o=e.target.closest(".hopen");if(o){openHist(o.dataset.key);return}const d=e.target.closest("[data-del]");if(d){D.hist=D.hist.filter(h=>h.key!==d.dataset.del);saveD();histList()}};
  $("#hc").onclick=()=>{if(D.hist.length&&confirm("Delete all saved history?")){D.hist=[];D.tools={};Object.keys(M).forEach(k=>delete M[k]);saveD();histList()}};
  $("#hx").onclick=()=>{if(!D.hist.length){toast("Nothing to export");return}
    const t=D.hist.map(h=>{const tl=findTool(h.tool);return "# "+h.title+"\n_"+(tl?tl.n:h.tool)+" · "+new Date(h.ts).toLocaleString()+"_\n\n"+h.msgs.map(m=>(m.role==="user"?"**You:** ":"**AI:** ")+m.content).join("\n\n")}).join("\n\n---\n\n");
    saveFile("switchboard-history.md",new Blob([t],{type:"text/markdown"}))}}

/* ---------- compare ---------- */
const C={prompt:"",sel:null,ctls:[],busy:false};
function viewCompare(){
  viewing="compare";const R=readyList();if(!C.sel)C.sel=R.slice(0,3).map(x=>x.id);
  $("#view").innerHTML=`<div class="thead" data-c="chat"><div class="big">🆚</div><div><h1>Compare AIs</h1><p>One prompt, several AIs, answers side by side.</p></div></div>
  <form id="cf" class="form" style="position:static;max-width:720px">
    <label class="fld"><span>Your prompt</span><textarea id="cp" rows="4" placeholder="Explain recursion to a 10-year-old">${esc(C.prompt)}</textarea></label>
    <div class="fld"><span>Ask these AIs</span>${R.length?`<div class="chk">${R.map(x=>`<label><input type="checkbox" value="${esc(x.id)}"${C.sel.includes(x.id)?" checked":""}> ${esc(x.n.replace(/ \(.*\)/,""))}<small>${esc(x.model||"")}</small></label>`).join("")}</div>`:`<p class="lede" style="margin:0">Add keys for two or more providers in AI keys to compare them.</p>`}</div>
    <button class="run" id="crun" style="max-width:220px">Compare</button></form>
  <div class="cmp" id="cmp"></div>`;
  $("#cp").oninput=e=>C.prompt=e.target.value;
  $("#cf").onchange=e=>{if(e.target.type==="checkbox")C.sel=[...document.querySelectorAll("#cf input[type=checkbox]:checked")].map(x=>x.value)};
  $("#cf").onsubmit=e=>{e.preventDefault();compare()}}
async function compare(){
  if(C.busy){C.ctls.forEach(c=>c.abort());return}
  if(!settled)await SAMPLE_P;
  const p=C.prompt.trim(),R=readyList();if(!p){toast("Write a prompt first");return}
  const ids=C.sel.filter(id=>R.some(x=>x.id===id));if(!ids.length){toast("Pick at least one AI");return}
  C.busy=true;$("#crun").textContent="Stop";C.ctls=[];
  $("#cmp").innerHTML=ids.map(id=>{const x=R.find(r=>r.id===id);return `<section class="col"><h3>${esc(x.n.replace(/ \(.*\)/,""))}<small>${esc(x.model||"")}</small></h3><div class="prose" id="c-${esc(id)}"><span class="dots"><i></i><i></i><i></i></span></div><p class="via" id="t-${esc(id)}"></p></section>`}).join("");
  const set=(id,k,h,txt)=>{const e=document.getElementById(k+"-"+id);if(e){if(txt)e.textContent=h;else e.innerHTML=h}};
  await Promise.all(ids.map(async id=>{
    const ctl=new AbortController();C.ctls.push(ctl);const t0=performance.now();
    try{const out=await ask([{role:"user",content:p}],sysFor({sys:BASE},{sys:"",vals:{}}),x=>set(id,"c",md(x)),ctl.signal,2048,id);
      set(id,"c",md(out));set(id,"t",((performance.now()-t0)/1000).toFixed(1)+"s · "+words(out)+" words",1)}
    catch(e){if(e.name==="AbortError"||e.code==="cancelled")set(id,"t","Stopped",1);else set(id,"c",`<div class="err">${esc(friendly(e))}</div>`)}
  }));
  C.busy=false;const b=$("#crun");if(b)b.textContent="Compare"}

  <div class="work" data-c="create"><form class="form" id="pf">
   <label class="fld"><span>Describe the image</span><textarea id="pp" rows="5" placeholder="A rainy Tokyo alley at night, neon reflections, cinematic photo">${esc(PH.prompt)}</textarea></label>
   <label class="fld"><span>Provider</span><select id="ppv">${R.map(x=>`<option value="${esc(x.id)}"${x.id===pid?" selected":""}>${esc(x.n.replace(/ \(.*\)/,""))}</option>`).join("")}</select></label>
   <label class="fld"><span>Image model</span><input id="pm" list="pml" value="${esc(mdl)}" placeholder="e.g. gpt-image-1"><datalist id="pml"><option value="gpt-image-1"><option value="dall-e-3"><option value="dall-e-2"><option value="flux"><option value="turbo"></datalist></label>
